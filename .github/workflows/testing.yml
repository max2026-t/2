name: Проверка качества ЛР 4

on: [push, pull_request]

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m flake8 src tests tools
      - run: python -m pytest -v --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100
